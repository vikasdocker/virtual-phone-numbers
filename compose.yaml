services:
  app:
    build: .
    image: linea-virtual-numbers:1.0.1
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      APP_MODE: live
      PORT: 3000
      DATABASE_PATH: /app/data/linea.db
      TRUST_PROXY: 1
    volumes:
      - linea_data:/app/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your production domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  linea_data:
  caddy_data:
  caddy_config:
