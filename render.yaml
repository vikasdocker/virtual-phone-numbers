# Free public preview only. No persistent storage and no real sales.
# Use render-production.yaml for the separately approved live-sales profile.
services:
  - type: web
    name: linea-virtual-numbers
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: preview
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_PATH
        value: ":memory:"
      - key: SALES_ENABLED
        value: "false"
      - key: LEGAL_REVIEWED
        value: "false"
      - key: MESSAGE_RETENTION_DAYS
        value: "1"
